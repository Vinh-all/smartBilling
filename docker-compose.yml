
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - frontend

  smartbilling-web:
    build:
      context: ../SmartBilling/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend

  smartbilling-api:
    build:
      context: ../SmartBilling/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../SmartBilling/backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - database

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../SmartBilling/backend/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export POSTGRES_DB="$${DB_NAME}"
        export POSTGRES_USER="$${DB_USER}"
        export POSTGRES_PASSWORD="$${DB_PASSWORD}"
        exec /usr/local/bin/docker-entrypoint.sh postgres
    volumes:
      - smartbilling-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${DB_USER}\" -d \"$${DB_NAME}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - database

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - smartbilling-web
      - smartbilling-api
    networks:
      - frontend
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "ChangeMe_12345"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    expose:
      - "9100"
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    expose:
      - "9113"
    depends_on:
      - nginx
    networks:
      - monitoring


  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - monitoring


networks:
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
  database:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  smartbilling-postgres-data:
  loki-data:
  alloy-data:
