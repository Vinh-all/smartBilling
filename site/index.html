
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của tôi</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 24px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0001;
        }

        .status {
            color: #15803d;
            font-weight: bold;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <header>
        <h1>Website của tôi</h1>
        <p>Triển khai bằng Docker Compose và Nginx</p>
    </header>

    <main>
        <h2>Triển khai thành công!</h2>
        <p>Website đang chạy trong Docker container.</p>
        <p class="status">● Hệ thống website đã sẵn sàng</p>
        <hr>
        <p>Hạ tầng: Docker Compose</p>
        <p>Reverse proxy: Nginx</p>
        <p>Giám sát: Prometheus và Grafana</p>
    </main>
</body>
</html>
